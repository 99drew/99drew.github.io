name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build web-app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

  build-treino:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treino-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build treino-app
        run: |
          npm ci
          npm run build
