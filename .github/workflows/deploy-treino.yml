name: deploy 99drew's Training

on:
  push:
    branches:
      - main
    paths:
      - "99drews-training/**"
      - ".github/workflows/deploy-treino.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 99drews-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # destino /treino intencionalmente inalterado: é o path gravado no manifest
      # (id/scope) do PWA já instalado no iPhone — trocar aqui faria o iOS tratar
      # como um app novo. Ver nota no README do 99drews-training.
      - name: Deploy to gh-pages (/treino)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./99drews-training/dist
          destination_dir: treino
          keep_files: true
